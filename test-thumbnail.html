<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Thumbnail Loading</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
        }
        .result {
            margin: 20px 0;
            padding: 15px;
            border: 1px solid #ccc;
            border-radius: 8px;
        }
        .success { background: #d4edda; border-color: #c3e6cb; }
        .error { background: #f8d7da; border-color: #f5c6cb; }
        img {
            max-width: 100%;
            border: 2px solid #667eea;
            border-radius: 8px;
        }
    </style>
</head>
<body>
    <h1>Thumbnail Loading Test</h1>
    
    <button onclick="testThumbnails()">Test Thumbnail URLs</button>
    
    <div id="results"></div>
    
    <script>
        const BACKEND_URL = 'https://syntaacademy-1.onrender.com';
        
        async function testThumbnails() {
            const resultsDiv = document.getElementById('results');
            resultsDiv.innerHTML = '<p>Testing...</p>';
            
            const thumbnails = [
                'Courses-th/algo2.gif',
                'Courses-th/soon1.jpg'
            ];
            
            let html = '';
            
            for (const thumbnailKey of thumbnails) {
                html += `<div class="result">`;
                html += `<h3>Testing: ${thumbnailKey}</h3>`;
                
                try {
                    const url = `${BACKEND_URL}/api/content/thumbnail/${encodeURIComponent(thumbnailKey)}`;
                    console.log('Fetching:', url);
                    
                    const response = await fetch(url);
                    console.log('Response status:', response.status);
                    
                    if (response.ok) {
                        const data = await response.json();
                        console.log('Signed URL:', data.url);
                        
                        html += `<p class="success">✅ Successfully got signed URL</p>`;
                        html += `<p><strong>Expires in:</strong> ${data.expiresIn} seconds</p>`;
                        html += `<p><strong>URL:</strong> <small>${data.url.substring(0, 100)}...</small></p>`;
                        html += `<img src="${data.url}" alt="${thumbnailKey}" onload="console.log('Image loaded successfully!')" onerror="console.error('Image failed to load!')">`;
                    } else {
                        const errorText = await response.text();
                        html += `<p class="error">❌ Failed: ${response.status} ${response.statusText}</p>`;
                        html += `<p>${errorText}</p>`;
                    }
                } catch (err) {
                    html += `<p class="error">❌ Exception: ${err.message}</p>`;
                    console.error('Error:', err);
                }
                
                html += `</div>`;
            }
            
            resultsDiv.innerHTML = html;
        }
    </script>
</body>
</html>
