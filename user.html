<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Synta Academy - Accueil</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <!-- CSS -->
    <link rel="icon" href="source/logoweb.png" type="image/x-icon">
    <link rel="stylesheet" href="css/user.css">
    <!-- Supabase Client Library -->
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
</head>
<body>
    <!-- Header with Profile Icon -->
    <div class="header-top">
        <!-- Mobile Menu Button -->
        <button class="mobile-menu-toggle" onclick="toggleMobileMenu()" aria-label="Toggle menu">
            <span></span>
            <span></span>
            <span></span>
        </button>
        
        <!-- Currency Balance -->
        <div class="currency-balance">
            <img src="source/dt.svg" alt="DT" class="currency-icon">
            <span class="balance-amount" id="userBalance">0.00</span>
            <span class="currency-label">DT</span>
        </div>
        
        <!-- Notification Icon -->
        <div class="notification-icon" onclick="toggleNotifications()">
            <i class="fas fa-bell"></i>
            <span class="notification-badge" id="notificationCount">3</span>
        </div>
        
        <div class="profile-dropdown">
            <div class="profile-picture" onclick="toggleProfileDropdown()">
                <i class="fas fa-user"></i>
            </div>
            <div class="dropdown-menu" id="profileDropdown">
                <div class="dropdown-item" onclick="loadPageAndCloseSidebar('profile'); toggleProfileDropdown();">
                    <i class="fas fa-user"></i>
                    <span>Mon Profil</span>
                </div>
                <div class="dropdown-item" onclick="logout()">
                    <i class="fas fa-sign-out-alt"></i>
                    <span>Déconnexion</span>
                </div>
            </div>
        </div>
    </div>

    <!-- Content Wrapper -->
    <div class="content-wrapper">
        <!-- Sidebar Navigation -->
        <div class="sidebar" id="sidebar">
            <div class="logo">
                <div class="logo-icon">
                    <img src="source/logosynta.png" alt="synta academy" width="55">
                </div>
                <span class="logo-text"> Synta Academy</span>
            </div>
            <ul class="nav-links">
                <li><a href="#" onclick="loadPageAndCloseSidebar('dashboard')" class="active">
                    <div class="nav-icon"><i class="fas fa-home"></i></div>
                    <span class="nav-text">Tableau de bord</span>
                </a></li>
                <li><a href="#" onclick="loadPageAndCloseSidebar('calendar')">
                    <div class="nav-icon"><i class="fas fa-calendar"></i></div>
                    <span class="nav-text">Calendrier</span>
                </a></li>
                <li><a href="#" onclick="loadPageAndCloseSidebar('courses')">
                    <div class="nav-icon"><i class="fas fa-book"></i></div>
                    <span class="nav-text">Cours</span>
                </a></li>
                <li><a href="#" onclick="loadPageAndCloseSidebar('paiement')">
                    <div class="nav-icon"><i class="fas fa-wallet"></i></div>
                    <span class="nav-text">Mon Portefeuille</span>
                </a></li>
                <li><a href="#" class="locked">
                    <div class="nav-icon"><i class="fas fa-gamepad"></i></div>
                    <span class="nav-text">Jeu d'apprentissage</span>
                    <i class="fas fa-lock lock-icon"></i>
                </a></li>
                <!-- Temporarily hidden until completed
                <li><a href="#" onclick="loadPageAndCloseSidebar('chatbot')">
                    <div class="nav-icon"><i class="fas fa-robot"></i></div>
                    <span class="nav-text">SyntaNova <span class="beta-badge">Beta</span></span>
                </a></li>
                -->
            </ul>
        </div>
        
        <!-- Main Content Area -->
        <section>
            <iframe src="pages/dashboard/dashboard.html" name="Principal" title="Zone principale"></iframe>
        </section>
    </div>

    <!-- Scripts -->
    <script src="authentication.js"></script>
    <script src="js/user.js"></script>
</body>
</html>
