<!DOCTYPE html>
<html lang="fr" dir="ltr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Synta Academy - Admin Dashboard</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <!-- CSS -->
    <link rel="icon" href="/source/logoweb.png" type="image/x-icon">
    <link rel="stylesheet" href="/css/user.css">
    <style>
        /* Admin specific overrides */
        .sidebar {
            background: rgba(30, 52, 72, 0.95);
            color: white;
        }

        .logo-text {
            color: white;
        }

        .nav-links a {
            color: rgba(255, 255, 255, 0.8);
        }

        .nav-links a:hover {
            background: rgba(255, 255, 255, 0.1);
            color: white;
        }

        .nav-links a.active {
            background: linear-gradient(45deg, #ff7b1a, #ffa500);
            box-shadow: 0 4px 15px rgba(255, 123, 26, 0.4);
        }

        .header-top {
            background: #ffffff;
            border-bottom: 1px solid #e2e8f0;
        }

        .admin-badge {
            background: #ff7b1a;
            color: white;
            padding: 0.2rem 0.6rem;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: 700;
            margin-right: 1rem;
        }

        /* Essential Fix for Modals inside Iframes */
        section {
            overflow: hidden !important;
            height: calc(100vh - 70px) !important;
        }

        #adminIframe {
            height: 100% !important;
            width: 100% !important;
            overflow-y: auto !important;
        }
    </style>
    <!-- Supabase Client Library -->
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="/admin/admin.css">
</head>

<body class="admin-shell">
    <!-- Header with Profile Icon -->
    <div class="header-top">
        <!-- Mobile Menu Button -->
        <button class="mobile-menu-toggle" onclick="toggleMobileMenu()" aria-label="Menu administration" aria-controls="sidebar" aria-expanded="false">
            <span></span>
            <span></span>
            <span></span>
        </button>

        <div class="header-actions" style="display: flex; align-items: center; margin-right: 15px;">
            <button type="button" class="notifications" id="notification-bell" aria-label="Notifications de paiement" style="position: relative; cursor: pointer; color: #1e3448; margin-right: 15px;" onclick="loadAdminPage('payments')">
                <i class="fas fa-bell" style="font-size: 1.2rem;"></i>
                <span id="notification-badge" style="display: none; position: absolute; top: -8px; right: -8px; background: #e53e3e; color: white; font-size: 0.65rem; font-weight: bold; padding: 2px 5px; border-radius: 50%;">0</span>
            </button>
        </div>

        <div class="admin-badge">ADMINISTRATEUR</div>

        <div class="profile-dropdown">
            <button type="button" class="profile-picture" onclick="toggleProfileDropdown()" aria-label="Profil administrateur" aria-expanded="false" aria-controls="profileDropdown">
                <i class="fas fa-user-shield" aria-hidden="true"></i>
            </button>
            <div class="dropdown-menu" id="profileDropdown">
                <button type="button" class="dropdown-item" onclick="window.location.href='/dashboard'">
                    <i class="fas fa-user"></i>
                    <span>Vue Étudiant</span>
                </button>
                <button type="button" class="dropdown-item" onclick="adminLogout()">
                    <i class="fas fa-sign-out-alt"></i>
                    <span>Déconnexion</span>
                </button>
            </div>
        </div>
    </div>

    <!-- Content Wrapper -->
    <div class="content-wrapper">
        <!-- Sidebar Navigation -->
        <nav class="sidebar" id="sidebar" aria-label="Administration">
            <div class="logo">
                <div class="logo-icon">
                    <img src="/source/logosynta.png" alt="synta academy" width="55">
                </div>
                <span class="logo-text"> Synta Admin</span>
            </div>
            <ul class="nav-links">
                <li><a href="#" onclick="loadAdminPage('overview')" class="active" aria-current="page" id="nav-overview">
                        <div class="nav-icon"><i class="fas fa-chart-line"></i></div>
                        <span class="nav-text">Vue d'ensemble</span>
                    </a></li>
                <li><a href="#" onclick="loadAdminPage('students')" id="nav-students">
                        <div class="nav-icon"><i class="fas fa-users"></i></div>
                        <span class="nav-text">Liste des Étudiants</span>
                    </a></li>
                <li><a href="#" onclick="loadAdminPage('offers')" id="nav-offers">
                        <div class="nav-icon"><i class="fas fa-tags"></i></div>
                        <span class="nav-text">Gestion des Offres</span>
                    </a></li>
                <li><a href="#" onclick="loadAdminPage('courses')" id="nav-courses">
                        <div class="nav-icon"><i class="fas fa-book-open"></i></div>
                        <span class="nav-text">Gestion des Cours</span>
                    </a></li>
                <li><a href="#" onclick="loadAdminPage('sessions')" id="nav-sessions">
                        <div class="nav-icon"><i class="fas fa-video"></i></div>
                        <span class="nav-text">Séances Live</span>
                    </a></li>
                <li><a href="#" onclick="loadAdminPage('payments')" id="nav-payments">
                        <div class="nav-icon"><i class="fas fa-money-bill-wave"></i></div>
                        <span class="nav-text">Paiements</span>
                    </a></li>
                <li><a href="#" onclick="loadAdminPage('free-session')" id="nav-free-session">
                        <div class="nav-icon"><i class="fas fa-rocket"></i></div>
                        <span class="nav-text">Session Gratuite</span>
                    </a></li>
            </ul>
        </nav>
        <div class="sidebar-overlay" aria-hidden="true" onclick="setMobileMenu(false, true)"></div>

        <!-- Main Content Area -->
        <section class="main-section">
            <iframe src="pages/overview.html" name="Principal" id="adminIframe" title="Zone d'administration"></iframe>
        </section>
    </div>

    <!-- Scripts -->
    <script src="/js/authentication.js"></script>
    <script src="js/admin-auth.js"></script>
    <script>
        // Check access immediately
        document.addEventListener('DOMContentLoaded', async () => {
            const admin = await checkAdminAccess();
            if (admin) {
                console.log('Admin session active');
                startNotificationPolling();
            }
        });

        async function fetchNotifications() {
            try {
                const response = await fetch('/api/admin/notifications');
                if (response.ok) {
                    const data = await response.json();
                    updateNotificationBadge(data.pendingPayments);
                }
            } catch (error) {
                console.error('Error fetching notifications:', error);
            }
        }

        function updateNotificationBadge(count) {
            const badge = document.getElementById('notification-badge');
            if (count > 0) {
                badge.textContent = count;
                badge.style.display = 'block';
            } else {
                badge.style.display = 'none';
            }
        }

        function startNotificationPolling() {
            fetchNotifications(); // Initial fetch
            setInterval(fetchNotifications, 60000); // Poll every 60 seconds
        }

        function loadAdminPage(page) {
            const iframe = document.getElementById('adminIframe');
            iframe.src = `pages/${page}.html`;

            document.querySelectorAll('.nav-links a').forEach(link => {
                const active = link.id === 'nav-' + page;
                link.classList.toggle('active', active);
                if (active) link.setAttribute('aria-current', 'page');
                else link.removeAttribute('aria-current');
            });
            setMobileMenu(false, true);
        }

        function setMobileMenu(open, restoreFocus = false) {
            const sidebar = document.getElementById('sidebar');
            const toggle = document.querySelector('.mobile-menu-toggle');
            const wasOpen = sidebar.classList.contains('active');
            sidebar.classList.toggle('active', open);
            toggle.classList.toggle('active', open);
            toggle.setAttribute('aria-expanded', String(open));
            document.querySelector('.sidebar-overlay').classList.toggle('active', open);
            if (open) sidebar.querySelector('a.active')?.focus();
            else if (wasOpen && restoreFocus) toggle.focus();
        }

        function toggleMobileMenu() {
            setMobileMenu(!document.getElementById('sidebar').classList.contains('active'));
        }

        function toggleProfileDropdown(forceOpen) {
            const dropdown = document.getElementById('profileDropdown');
            const open = forceOpen ?? !dropdown.classList.contains('active');
            dropdown.classList.toggle('active', open);
            document.querySelector('.profile-picture').setAttribute('aria-expanded', String(open));
        }

        document.addEventListener('click', event => {
            if (!event.target.closest('.profile-dropdown')) toggleProfileDropdown(false);
        });
        document.addEventListener('keydown', event => {
            if (event.key !== 'Escape') return;
            setMobileMenu(false, true);
            if (document.getElementById('profileDropdown').classList.contains('active')) {
                toggleProfileDropdown(false);
                document.querySelector('.profile-picture').focus();
            }
        });
        window.matchMedia('(max-width: 900px)').addEventListener('change', () => setMobileMenu(false));
    </script>
</body>

</html>
