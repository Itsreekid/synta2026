<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Session Gratuite</title>
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="../../css/user.css">
    <style>
        body { padding: 2rem; background: #f8fafc; font-family: 'Tajawal', sans-serif; color: #1e293b; }
        .card { background: white; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); padding: 1.5rem; margin-bottom: 2rem; }
        .card-header { display: flex; justify-content: space-between; align-items: center; cursor: pointer; user-select: none; padding-bottom: 0.5rem; border-bottom: 1px solid transparent; transition: border-bottom 0.2s; }
        .card.expanded .card-header { border-bottom: 1px solid #e2e8f0; margin-bottom: 1.5rem; }
        .card-body { display: none; }
        .card.expanded .card-body { display: block; animation: fadeIn 0.3s ease; }
        .toggle-icon { transition: transform 0.3s ease; color: #94a3b8; }
        .card.expanded .toggle-icon { transform: rotate(180deg); }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(-5px); } to { opacity: 1; transform: translateY(0); } }
        .card-title { font-size: 1.25rem; font-weight: 700; color: #0f172a; margin: 0; }
        .btn { padding: 0.5rem 1rem; border-radius: 6px; font-weight: 600; cursor: pointer; border: none; transition: 0.2s; font-family: inherit; }
        .btn-primary { background: #f07e15; color: white; }
        .btn-primary:hover { background: #d97113; }
        .btn-outline { background: transparent; border: 1px solid #cbd5e1; color: #475569; }
        .btn-danger { background: #ef4444; color: white; }
        .btn-success { background: #10b981; color: white; }
        .input-group { margin-bottom: 1rem; }
        .input-group label { display: block; font-weight: 600; margin-bottom: 0.5rem; font-size: 0.875rem; color: #475569; }
        .input-group input, .input-group select, .input-group textarea { width: 100%; padding: 0.625rem 0.75rem; border: 1px solid #cbd5e1; border-radius: 8px; font-family: inherit; font-size: 0.95rem; transition: border 0.2s; box-sizing: border-box; }
        .input-group input:focus, .input-group select:focus, .input-group textarea:focus { outline: none; border-color: #f07e15; box-shadow: 0 0 0 3px rgba(240,126,21,0.12); }
        .toast { position: fixed; top: 1.5rem; right: 1.5rem; background: #10b981; color: white; padding: 0.75rem 1.25rem; border-radius: 8px; font-weight: 600; z-index: 999; display: none; }
        
        /* Modal */
        .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); display: none; justify-content: center; align-items: center; z-index: 1000; }
        .modal { background: white; border-radius: 12px; padding: 2rem; width: 100%; max-width: 500px; max-height: 90vh; overflow-y: auto; }
        .modal.active, .modal-overlay.active { display: flex; }
        
        /* Questions List */
        .question-item { border: 1px solid #e2e8f0; border-radius: 8px; padding: 1rem; margin-bottom: 1rem; display: flex; justify-content: space-between; align-items: flex-start; }
        .question-type { display: inline-block; padding: 0.25rem 0.5rem; border-radius: 4px; font-size: 0.75rem; font-weight: 700; background: #e0f2fe; color: #0369a1; margin-bottom: 0.5rem; }
        .question-type.drag_drop { background: #ffedd5; color: #c2410c; }
        .question-actions { display: flex; gap: 0.5rem; }
        
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
    </style>
</head>
<body>

    <!-- Config Section -->
    <div class="card expanded">
        <div class="card-header" onclick="this.parentElement.classList.toggle('expanded')">
            <h2 class="card-title"><i class="fas fa-rocket"></i> &nbsp;Configuration de la Session</h2>
            <div>
                <button class="btn btn-primary" onclick="event.stopPropagation(); saveConfig()" id="btnSaveConfig"><i class="fas fa-save"></i> Enregistrer</button>
                <i class="fas fa-chevron-down toggle-icon" style="margin-left: 1rem; font-size: 1.25rem;"></i>
            </div>
        </div>
        <div class="card-body">
            <div class="grid-2">
                <div class="input-group">
                    <label><i class="fas fa-calendar-alt" style="color:#f07e15"></i> Date &amp; Heure de la session</label>
                    <input type="datetime-local" id="config-date" placeholder="Choisir une date et heure">
                    <small style="color:#94a3b8; margin-top:0.25rem; display:block;">Sélectionne la date et l'heure sur le calendrier</small>
                </div>
                <div class="input-group">
                    <label><i class="fas fa-book" style="color:#f07e15"></i> Matière</label>
                    <input type="text" id="config-matiere" placeholder="Ex: Mathématiques, Physique...">
                </div>
            </div>
        </div>
    </div>

    <!-- Questions Section -->
    <!-- Questions Section -->
    <div class="card">
        <div class="card-header" onclick="this.parentElement.classList.toggle('expanded')">
            <h2 class="card-title"><i class="fas fa-list-check"></i> Questions du Quiz</h2>
            <div>
                <button class="btn btn-primary" onclick="event.stopPropagation(); openModal()"><i class="fas fa-plus"></i> Nouvelle Question</button>
                <i class="fas fa-chevron-down toggle-icon" style="margin-left: 1rem; font-size: 1.25rem;"></i>
            </div>
        </div>
        <div class="card-body">
            <div id="questions-list">
                <p>Chargement des questions...</p>
            </div>
        </div>
    </div>

    <!-- Registered Students Section -->
    <div class="card expanded">
        <div class="card-header" onclick="this.parentElement.classList.toggle('expanded')">
            <h2 class="card-title"><i class="fas fa-users"></i> Étudiants Inscrits (Session Gratuite)</h2>
            <div>
                <button class="btn btn-outline" onclick="event.stopPropagation(); fetchStudents()"><i class="fas fa-sync-alt"></i> Rafraîchir</button>
                <i class="fas fa-chevron-down toggle-icon" style="margin-left: 1rem; font-size: 1.25rem;"></i>
            </div>
        </div>
        <div class="card-body">
            <div style="overflow-x: auto;">
                <table style="width: 100%; text-align: left; border-collapse: collapse;">
                    <thead>
                        <tr style="border-bottom: 2px solid #e2e8f0;">
                            <th style="padding: 1rem 0.5rem; color:#475569;">Nom & Prénom</th>
                            <th style="padding: 1rem 0.5rem; color:#475569;">Contact</th>
                            <th style="padding: 1rem 0.5rem; color:#475569;">Filière</th>
                            <th style="padding: 1rem 0.5rem; color:#475569;">Niveau</th>
                            <th style="padding: 1rem 0.5rem; color:#475569;">Groupe Assigné</th>
                            <th style="padding: 1rem 0.5rem; color:#475569;">Score</th>
                            <th style="padding: 1rem 0.5rem; color:#475569;">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="students-list">
                        <tr><td colspan="6" style="padding: 1rem; text-align: center;">Chargement...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Student Detail Modal -->
    <div class="modal-overlay" id="studentModalOverlay">
        <div class="modal" style="max-width: 600px;">
            <h2 class="card-title" id="studentModalTitle" style="margin-bottom: 1.5rem;">Détails du Quiz</h2>
            <div id="studentModalContent" style="display: flex; flex-direction: column; gap: 1rem;"></div>
            <div style="margin-top: 1.5rem; text-align: right;">
                <button class="btn btn-outline" onclick="closeStudentModal()">Fermer</button>
            </div>
        </div>
    </div>

    <!-- Modal -->
    <div class="modal-overlay" id="questionModalOverlay">
        <div class="modal">
            <h2 class="card-title mb-4" id="modalTitle">Nouvelle Question</h2>
            <input type="hidden" id="q-id">
            
            <div class="input-group">
                <label>Type de question</label>
                <select id="q-type" onchange="toggleTypeHelp()">
                    <option value="multiple_choice">Choix Multiple (QCM)</option>
                    <option value="drag_drop">Drag & Drop (Ordonner)</option>
                </select>
            </div>
            
            <div class="input-group">
                <label>Texte de la question</label>
                <textarea id="q-text" rows="3" placeholder="Ex: Quel est le résultat de..."></textarea>
            </div>
            
            <div class="input-group">
                <label>Options (Format JSON: [{"id":"a", "label":"Option 1"}, ...])</label>
                <textarea id="q-options" rows="4"></textarea>
            </div>
            
            <div class="input-group">
                <label>Réponse Correcte <span id="q-help" style="font-weight:normal; color:#64748b;">(ex: "b")</span></label>
                <input type="text" id="q-correct">
            </div>
            
            <div class="input-group">
                <label>Ordre (Position)</label>
                <input type="number" id="q-order" value="0">
            </div>
            
            <div style="display: flex; gap: 1rem; margin-top: 1.5rem;">
                <button class="btn btn-outline" style="flex:1;" onclick="closeModal()">Annuler</button>
                <button class="btn btn-primary" style="flex:1;" onclick="saveQuestion()" id="btnSaveQuestion">Enregistrer</button>
            </div>
        </div>
    </div>

    <script>
        // --- API Helpers ---
        async function fetchConfig() {
            try {
                const res = await fetch('/api/session/admin/config');
                const data = await res.json();
                if(data.config) {
                    document.getElementById('config-date').value = data.config.session_date || '';
                    document.getElementById('config-matiere').value = data.config.session_matiere || '';
                }
            } catch(e) { console.error(e); }
        }

        async function saveConfig() {
            const btn = document.getElementById('btnSaveConfig');
            btn.textContent = "Enregistrement...";
            const date = document.getElementById('config-date').value;
            const matiere = document.getElementById('config-matiere').value;
            
            try {
                const res = await fetch('/api/session/admin/config', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ session_date: date, session_matiere: matiere })
                });
                if(res.ok) alert("Configuration enregistrée !");
                else alert("Erreur lors de l'enregistrement.");
            } catch(e) { alert("Erreur réseau"); }
            btn.textContent = "Enregistrer";
        }

        let questions = [];

        async function fetchQuestions() {
            try {
                const res = await fetch('/api/session/admin/questions');
                const data = await res.json();
                questions = data.questions || [];
                renderQuestions();
            } catch(e) { 
                document.getElementById('questions-list').innerHTML = "<p>Erreur lors du chargement.</p>";
            }
        }

        function renderQuestions() {
            const container = document.getElementById('questions-list');
            if(questions.length === 0) {
                container.innerHTML = "<p>Aucune question trouvée.</p>";
                return;
            }
            
            let html = '';
            questions.forEach(q => {
                html += `
                <div class="question-item" style="opacity: ${q.is_active ? '1' : '0.5'}">
                    <div style="flex: 1; padding-right: 1rem;">
                        <span class="question-type ${q.type}">${q.type === 'multiple_choice' ? 'QCM' : 'Drag & Drop'} (Ordre: ${q.order_index})</span>
                        <h3 style="margin: 0.25rem 0; font-size: 1rem;">${q.text}</h3>
                        <p style="margin:0; font-size: 0.8rem; color:#64748b;">Réponse: ${JSON.stringify(q.correct_answer)}</p>
                    </div>
                    <div class="question-actions">
                        <button class="btn ${q.is_active ? 'btn-outline' : 'btn-success'}" onclick="toggleQuestion('${q.id}', ${q.is_active})"><i class="fas fa-eye${q.is_active ? '-slash' : ''}"></i></button>
                        <button class="btn btn-outline" onclick="editQuestion('${q.id}')"><i class="fas fa-edit"></i></button>
                        <button class="btn btn-danger" onclick="deleteQuestion('${q.id}')"><i class="fas fa-trash"></i></button>
                    </div>
                </div>
                `;
            });
            container.innerHTML = html;
        }

        // --- Modals & Actions ---
        function openModal() {
            document.getElementById('q-id').value = '';
            document.getElementById('q-text').value = '';
            document.getElementById('q-options').value = '[\n  {"id": "a", "label": "Option 1"},\n  {"id": "b", "label": "Option 2"}\n]';
            document.getElementById('q-correct').value = '"a"';
            document.getElementById('q-order').value = '0';
            document.getElementById('q-type').value = 'multiple_choice';
            document.getElementById('modalTitle').textContent = "Nouvelle Question";
            toggleTypeHelp();
            document.getElementById('questionModalOverlay').classList.add('active');
        }

        function editQuestion(id) {
            const q = questions.find(x => x.id === id);
            if(!q) return;
            document.getElementById('q-id').value = q.id;
            document.getElementById('q-text').value = q.text;
            document.getElementById('q-options').value = JSON.stringify(q.options, null, 2);
            document.getElementById('q-correct').value = JSON.stringify(q.correct_answer);
            document.getElementById('q-order').value = q.order_index;
            document.getElementById('q-type').value = q.type;
            document.getElementById('modalTitle').textContent = "Modifier Question";
            toggleTypeHelp();
            document.getElementById('questionModalOverlay').classList.add('active');
        }

        function closeModal() {
            document.getElementById('questionModalOverlay').classList.remove('active');
        }

        function toggleTypeHelp() {
            const type = document.getElementById('q-type').value;
            const help = document.getElementById('q-help');
            if(type === 'multiple_choice') {
                help.textContent = '(ex: "a")';
            } else {
                help.textContent = '(ex: ["2", "1", "3"])';
            }
        }

        async function saveQuestion() {
            const btn = document.getElementById('btnSaveQuestion');
            btn.textContent = "Enregistrement...";
            
            const id = document.getElementById('q-id').value;
            
            try {
                let options = JSON.parse(document.getElementById('q-options').value);
                let correct_answer = JSON.parse(document.getElementById('q-correct').value);
                
                const payload = {
                    text: document.getElementById('q-text').value,
                    type: document.getElementById('q-type').value,
                    options: options,
                    correct_answer: correct_answer,
                    order_index: parseInt(document.getElementById('q-order').value) || 0
                };

                let url = '/api/session/admin/questions';
                let method = 'POST';
                if(id) {
                    payload.id = id;
                    method = 'PATCH';
                }

                const res = await fetch(url, {
                    method: method,
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(payload)
                });
                
                if(res.ok) {
                    closeModal();
                    fetchQuestions();
                } else {
                    const err = await res.json();
                    alert("Erreur: " + err.error);
                }
            } catch(e) {
                alert("Format JSON invalide dans Options ou Réponse.");
            }
            btn.textContent = "Enregistrer";
        }

        async function deleteQuestion(id) {
            if(!confirm("Supprimer cette question ?")) return;
            const res = await fetch('/api/session/admin/questions', {
                method: 'DELETE',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ id })
            });
            if(res.ok) fetchQuestions();
        }

        async function toggleQuestion(id, currentState) {
            const res = await fetch('/api/session/admin/questions', {
                method: 'PATCH',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ id, is_active: !currentState })
            });
            if(res.ok) fetchQuestions();
        }

        let studentsData = [];

        async function fetchStudents() {
            try {
                const res = await fetch('/api/session/admin/students');
                const data = await res.json();
                studentsData = data.students || [];
                renderStudents();
            } catch(e) {
                document.getElementById('students-list').innerHTML = "<tr><td colspan='6' style='text-align:center;'>Erreur de chargement.</td></tr>";
            }
        }

        function renderStudents() {
            const tbody = document.getElementById('students-list');
            if (studentsData.length === 0) {
                tbody.innerHTML = "<tr><td colspan='6' style='text-align:center; padding:1rem;'>Aucun étudiant inscrit.</td></tr>";
                return;
            }

            let html = '';
            studentsData.forEach(s => {
                const name = s.full_name || 'N/A';
                const email = s.email || 'N/A';
                const phone = s.phone || 'N/A';
                const groupBadge = s.group === 'advanced' 
                    ? '<span style="background:#fef3c7; color:#d97706; padding:2px 8px; border-radius:12px; font-size:0.8rem; font-weight:bold;">Avancé</span>'
                    : '<span style="background:#e0f2fe; color:#0369a1; padding:2px 8px; border-radius:12px; font-size:0.8rem; font-weight:bold;">Débutant/Moyen</span>';

                html += `
                <tr style="border-bottom: 1px solid #f1f5f9;">
                    <td style="padding: 1rem 0.5rem; font-weight:600;">${name}</td>
                    <td style="padding: 1rem 0.5rem; font-size:0.85rem; color:#64748b;">${email}<br>${phone}</td>
                    <td style="padding: 1rem 0.5rem; font-size:0.85rem;">${s.filier || '-'}</td>
                    <td style="padding: 1rem 0.5rem;">${s.track || '-'}</td>
                    <td style="padding: 1rem 0.5rem;">${groupBadge}</td>
                    <td style="padding: 1rem 0.5rem; font-weight:bold; color:#10b981;">${s.score != null ? s.score : '-'}</td>
                    <td style="padding: 1rem 0.5rem;">
                        <button class="btn btn-outline" style="padding:0.25rem 0.5rem; font-size:0.85rem;" onclick="viewStudentDetails('${s.id}')">
                            <i class="fas fa-search"></i>
                        </button>
                    </td>
                </tr>
                `;
            });
            tbody.innerHTML = html;
        }

        function viewStudentDetails(id) {
            const student = studentsData.find(x => x.id === id);
            if (!student) return;

            document.getElementById('studentModalTitle').textContent = `Détails Quiz - ${student.full_name || 'Étudiant'}`;
            
            const content = document.getElementById('studentModalContent');
            if (!student.quiz_details || Object.keys(student.quiz_details).length === 0) {
                content.innerHTML = "<p>Aucun détail de quiz disponible.</p>";
            } else {
                let detailsHtml = '';
                // Since we don't have the question text directly in the details JSON, 
                // we'll try to match it with our questions list
                for (const [qId, ansData] of Object.entries(student.quiz_details)) {
                    const q = questions.find(x => x.id === qId);
                    const qText = q ? q.text : `Question ID: ${qId}`;
                    
                    const isCorrect = ansData.is_correct;
                    const icon = isCorrect 
                        ? '<i class="fas fa-check-circle" style="color:#10b981;"></i>' 
                        : '<i class="fas fa-times-circle" style="color:#ef4444;"></i>';
                    
                    detailsHtml += `
                    <div style="background:#f8fafc; border:1px solid #e2e8f0; border-radius:8px; padding:1rem;">
                        <div style="display:flex; justify-content:space-between; margin-bottom:0.5rem;">
                            <strong style="color:#334155;">${qText}</strong>
                            <span>${icon}</span>
                        </div>
                        <div style="font-size:0.9rem; color:#64748b;">
                            <div><span style="font-weight:600;">Réponse de l'étudiant:</span> ${JSON.stringify(ansData.user_answer)}</div>
                            <div><span style="font-weight:600;">Réponse correcte:</span> ${JSON.stringify(ansData.correct_answer)}</div>
                        </div>
                    </div>
                    `;
                }
                content.innerHTML = detailsHtml;
            }

            document.getElementById('studentModalOverlay').classList.add('active');
        }

        function closeStudentModal() {
            document.getElementById('studentModalOverlay').classList.remove('active');
        }

        // Init
        document.addEventListener('DOMContentLoaded', () => {
            fetchConfig();
            fetchQuestions();
            fetchStudents();
        });
    </script>
</body>
</html>
