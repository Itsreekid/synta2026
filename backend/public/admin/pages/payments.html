<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Synta Academy - Gestion des Paiements</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body {
            font-family: 'Tajawal', sans-serif;
            margin: 0;
            padding: 2rem;
            background: #f8fafc;
            color: #1e293b;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
        }

        .title {
            font-size: 1.5rem;
            font-weight: 700;
            color: #1e3448;
            margin: 0;
        }

        .table-container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
            overflow: hidden;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 1rem;
            text-align: left;
            border-bottom: 1px solid #e2e8f0;
        }

        th {
            background: #f1f5f9;
            font-weight: 700;
            color: #64748b;
            text-transform: uppercase;
            font-size: 0.85rem;
        }

        tr:hover {
            background: #f8fafc;
        }

        .status-badge {
            padding: 0.25rem 0.75rem;
            border-radius: 9999px;
            font-size: 0.85rem;
            font-weight: 500;
        }

        .status-pending {
            background: #fef3c7;
            color: #d97706;
        }

        .status-completed {
            background: #dcfce3;
            color: #166534;
        }

        .status-rejected {
            background: #fee2e2;
            color: #991b1b;
        }

        .action-btn {
            padding: 0.5rem 1rem;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            font-weight: 500;
            font-size: 0.85rem;
            transition: all 0.2s;
            margin-right: 0.5rem;
        }

        .btn-confirm {
            background: #22c55e;
            color: white;
        }

        .btn-confirm:hover {
            background: #16a34a;
        }

        .btn-reject {
            background: #ef4444;
            color: white;
        }

        .btn-reject:hover {
            background: #dc2626;
        }

        .empty-state {
            text-align: center;
            padding: 3rem;
            color: #64748b;
        }

        .empty-state i {
            font-size: 3rem;
            margin-bottom: 1rem;
            color: #cbd5e1;
        }
    </style>
</head>

<body>
    <div class="header">
        <h1 class="title">Gestion des Paiements</h1>
        <div>
            <select id="statusFilter" onchange="loadPayments()" style="padding: 0.5rem; border-radius: 6px; border: 1px solid #cbd5e1;">
                <option value="">Tous les statuts</option>
                <option value="pending" selected>En attente</option>
                <option value="completed">Confirmés</option>
                <option value="rejected">Rejetés</option>
            </select>
        </div>
    </div>

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>Date</th>
                    <th>Étudiant</th>
                    <th>Email</th>
                    <th>Montant</th>
                    <th>Méthode</th>
                    <th>Code/Réf</th>
                    <th>Statut</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="paymentsTableBody">
                <!-- Data populated by JS -->
            </tbody>
        </table>
    </div>

    <!-- Script to fetch and display payments -->
    <script>
        async function loadPayments() {
            const tbody = document.getElementById('paymentsTableBody');
            const statusFilter = document.getElementById('statusFilter').value;
            
            tbody.innerHTML = '<tr><td colspan="8" style="text-align: center;">Chargement...</td></tr>';
            
            try {
                // Determine API endpoint depending on implementation (AdminDashboard should have a method or direct fetch)
                let url = '/api/admin/payments';
                if (statusFilter) {
                    url += `?status=${statusFilter}`;
                }
                
                const response = await fetch(url);
                if (!response.ok) throw new Error('Erreur réseau');
                
                const data = await response.json();
                
                if (data.success) {
                    renderPayments(data.data);
                } else {
                    throw new Error(data.error);
                }
            } catch (error) {
                console.error('Erreur:', error);
                tbody.innerHTML = `<tr><td colspan="8" style="text-align: center; color: red;">Erreur: ${error.message}</td></tr>`;
            }
        }

        let currentPayments = [];

        function renderPayments(payments) {
            currentPayments = payments;
            const tbody = document.getElementById('paymentsTableBody');
            
            if (!payments || payments.length === 0) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="8" class="empty-state">
                            <i class="fas fa-inbox"></i>
                            <p>Aucun paiement trouvé.</p>
                        </td>
                    </tr>
                `;
                return;
            }

            tbody.innerHTML = payments.map(p => `
                <tr onclick="showDetailsModal('${p.id}')" style="cursor: pointer;">
                    <td>${new Date(p.created_at).toLocaleDateString('fr-FR')}</td>
                    <td>${p.user_name || 'N/A'}</td>
                    <td>${p.user_email || 'N/A'}</td>
                    <td style="font-weight: bold;">${p.amount} DT</td>
                    <td>${p.payment_method || 'N/A'}</td>
                    <td>${p.transaction_code || '-'}</td>
                    <td>
                        <span class="status-badge status-${p.status}">
                            ${p.status === 'pending' ? 'En attente' : 
                              p.status === 'completed' ? 'Confirmé' : 'Rejeté'}
                        </span>
                        ${p.receipt_url ? `
                            <br><a href="${p.receipt_url}" target="_blank" onclick="event.stopPropagation()" style="font-size: 0.8rem; color: #3b82f6; text-decoration: none; margin-top: 5px; display: inline-block;">
                                <i class="fas fa-image"></i> Voir reçu
                            </a>
                        ` : ''}
                    </td>
                    <td>
                        ${p.status === 'pending' ? `
                            <button class="action-btn btn-confirm" onclick="event.stopPropagation(); confirmPayment('${p.id}')">Confirmer</button>
                            <button class="action-btn btn-reject" onclick="event.stopPropagation(); rejectPayment('${p.id}')">Rejeter</button>
                        ` : '-'}
                    </td>
                </tr>
            `).join('');
        }

        function showDetailsModal(id) {
            const p = currentPayments.find(tx => tx.id === id);
            if (!p) return;

            // Remove existing modal if any
            const existing = document.getElementById('payment-modal');
            if (existing) existing.remove();

            const modal = document.createElement('div');
            modal.id = 'payment-modal';
            modal.style.cssText = `
                position: fixed; top: 0; left: 0; width: 100%; height: 100%;
                background: rgba(0,0,0,0.5); display: flex; justify-content: center; align-items: center;
                z-index: 1000; padding: 1rem;
            `;

            modal.innerHTML = `
                <div style="background: white; border-radius: 12px; max-width: 500px; width: 100%; padding: 2rem; position: relative; box-shadow: 0 10px 25px rgba(0,0,0,0.2);">
                    <button onclick="document.getElementById('payment-modal').remove()" style="position: absolute; right: 1rem; top: 1rem; border: none; background: none; font-size: 1.5rem; cursor: pointer; color: #64748b;">&times;</button>
                    <h2 style="margin-top: 0; color: #1e293b; border-bottom: 1px solid #e2e8f0; padding-bottom: 0.5rem; margin-bottom: 1.5rem;">Détails de la transaction</h2>
                    
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: 1.5rem;">
                        <div><strong style="color: #64748b; font-size: 0.85rem; text-transform: uppercase;">Date</strong><div style="font-weight: 500;">${new Date(p.created_at).toLocaleString('fr-FR')}</div></div>
                        <div><strong style="color: #64748b; font-size: 0.85rem; text-transform: uppercase;">Montant</strong><div style="font-weight: 700; color: #10b981; font-size: 1.1rem;">${p.amount} DT</div></div>
                        
                        <div><strong style="color: #64748b; font-size: 0.85rem; text-transform: uppercase;">Statut</strong>
                            <div>
                                <span class="status-badge status-${p.status}">
                                    ${p.status === 'pending' ? 'En attente' : p.status === 'completed' ? 'Confirmé' : 'Rejeté'}
                                </span>
                            </div>
                        </div>
                        <div><strong style="color: #64748b; font-size: 0.85rem; text-transform: uppercase;">Code / Réf</strong><div style="font-weight: 500;">${p.transaction_code || '-'}</div></div>
                    </div>

                    <h3 style="color: #1e293b; font-size: 1.1rem; border-bottom: 1px solid #e2e8f0; padding-bottom: 0.5rem; margin-bottom: 1rem;">Informations Étudiant</h3>
                    
                    <div style="display: grid; grid-template-columns: 1fr; gap: 0.8rem;">
                        <div><strong style="color: #64748b; font-size: 0.85rem; text-transform: uppercase; display: inline-block; width: 100px;">Nom:</strong> <span style="font-weight: 500;">${p.user_name || 'N/A'}</span></div>
                        <div><strong style="color: #64748b; font-size: 0.85rem; text-transform: uppercase; display: inline-block; width: 100px;">Email:</strong> <span style="font-weight: 500;">${p.user_email || 'N/A'}</span></div>
                        <div><strong style="color: #64748b; font-size: 0.85rem; text-transform: uppercase; display: inline-block; width: 100px;">Téléphone:</strong> <span style="font-weight: 500;">${p.user_phone || 'N/A'}</span></div>
                        <div><strong style="color: #64748b; font-size: 0.85rem; text-transform: uppercase; display: inline-block; width: 100px;">Niveau:</strong> <span style="font-weight: 500;">${p.user_class || 'N/A'}</span></div>
                        <div><strong style="color: #64748b; font-size: 0.85rem; text-transform: uppercase; display: inline-block; width: 100px;">Filière:</strong> <span style="font-weight: 500;">${p.user_branch || 'N/A'}</span></div>
                    </div>

                    ${p.receipt_url ? `
                        <div style="margin-top: 1.5rem; padding-top: 1.5rem; border-top: 1px solid #e2e8f0; text-align: center;">
                            <a href="${p.receipt_url}" target="_blank" style="display: inline-block; background: #f1f5f9; padding: 0.5rem 1rem; border-radius: 6px; color: #3b82f6; text-decoration: none; font-weight: 500;">
                                <i class="fas fa-external-link-alt"></i> Ouvrir le reçu en plein écran
                            </a>
                        </div>
                    ` : ''}
                </div>
            `;

            document.body.appendChild(modal);

            // Close modal on background click
            modal.onclick = (e) => {
                if (e.target === modal) modal.remove();
            };
        }

        async function confirmPayment(id) {
            if (!confirm("Êtes-vous sûr de vouloir confirmer ce paiement ? Le solde de l'étudiant sera crédité.")) return;
            
            try {
                const response = await fetch(`/api/admin/payments/${id}/confirm`, {
                    method: 'POST'
                });
                const result = await response.json();
                
                if (result.success) {
                    alert('Paiement confirmé avec succès.');
                    loadPayments();
                    // Force refresh notifications in parent
                    if (window.parent && window.parent.fetchNotifications) {
                        window.parent.fetchNotifications();
                    }
                } else {
                    alert('Erreur: ' + result.error);
                }
            } catch (error) {
                alert('Erreur de connexion');
            }
        }

        async function rejectPayment(id) {
            if (!confirm('Êtes-vous sûr de vouloir rejeter ce paiement ?')) return;
            
            try {
                const response = await fetch(`/api/admin/payments/${id}/reject`, {
                    method: 'POST'
                });
                const result = await response.json();
                
                if (result.success) {
                    alert('Paiement rejeté.');
                    loadPayments();
                    // Force refresh notifications in parent
                    if (window.parent && window.parent.fetchNotifications) {
                        window.parent.fetchNotifications();
                    }
                } else {
                    alert('Erreur: ' + result.error);
                }
            } catch (error) {
                alert('Erreur de connexion');
            }
        }

        // Initial load
        document.addEventListener('DOMContentLoaded', loadPayments);
    </script>
</body>

</html>
