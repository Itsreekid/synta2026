<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Détails du Cours - Synta Academy</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../css/courses.css">
    
    <!-- Supabase Client Library -->
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    
    <style>
        body {
            background: #f4f8ff;
            margin: 0;
            padding: 0;
            overflow: hidden;
            height: 100vh;
        }
        
        .course-details-container {
            max-width: 100%;
            height: 100vh;
            margin: 0 auto;
            padding: 1rem 2rem;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        
        .course-layout {
            display: grid;
            grid-template-columns: 1fr 340px;
            gap: 1.5rem;
            align-items: start;
            flex: 1;
            overflow: hidden;
            height: calc(100vh - 4rem);
        }
        
        .course-main {
            background: white;
            border-radius: 16px;
            padding: 1.5rem;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            overflow-y: auto;
            height: 100%;
            display: flex;
            flex-direction: column;
        }
        
        .course-thumbnail-header {
            width: 100%;
            height: 80px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 12px;
            margin-bottom: 1.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 2rem;
            font-weight: 700;
        }
        
        .course-title-section h1 {
            font-size: 2rem;
            color: #1e293b;
            margin-bottom: 1rem;
            font-weight: 700;
        }
        
        .course-description-section {
            margin-bottom: 2rem;
        }
        
        .course-description-section h2 {
            font-size: 1.25rem;
            color: #1e293b;
            margin-bottom: 0.75rem;
            font-weight: 600;
        }
        
        .course-description-section p {
            color: #64748b;
            line-height: 1.7;
        }
        
        .modules-section {
            margin-top: 2rem;
        }
        
        .module-card {
            background: #f8fafc;
            border-radius: 12px;
            margin-bottom: 1.5rem;
            overflow: hidden;
            border: 1px solid #e2e8f0;
        }
        
        .module-header {
            padding: 1.25rem 1.5rem;
            background: white;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: background 0.2s;
        }
        
        .module-header:hover {
            background: #f8fafc;
        }
        
        .module-header h3 {
            font-size: 1.1rem;
            color: #1e293b;
            font-weight: 600;
            margin: 0;
        }
        
        .module-toggle {
            font-size: 1.25rem;
            color: #64748b;
            transition: transform 0.3s;
        }
        
        .module-toggle.open {
            transform: rotate(180deg);
        }
        
        .lessons-list {
            padding: 0.5rem;
            display: none;
        }
        
        .lessons-list.open {
            display: block;
        }
        
        .lesson-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 1.25rem;
            background: white;
            border-radius: 8px;
            margin-bottom: 0.5rem;
            transition: all 0.2s;
            border: 1px solid #e2e8f0;
        }
        
        .lesson-item:hover {
            background: #f1f5f9;
            transform: translateX(-4px);
        }
        
        .lesson-item.locked {
            opacity: 0.6;
            background: #f9fafb;
        }
        
        .lesson-info {
            display: flex;
            gap: 1rem;
            align-items: center;
            flex: 1;
        }
        
        .lesson-icon {
            font-size: 1.25rem;
            color: #667eea;
        }
        
        .lesson-details {
            flex: 1;
        }
        
        .lesson-title {
            font-size: 0.95rem;
            color: #334155;
            font-weight: 500;
            margin-bottom: 0.25rem;
        }
        
        .lesson-duration {
            font-size: 0.85rem;
            color: #94a3b8;
        }
        
        .lesson-status {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        
        .lock-icon {
            font-size: 1.1rem;
            color: #94a3b8;
        }
        
        .play-icon {
            font-size: 1.1rem;
            color: #667eea;
            cursor: pointer;
        }
        
        .course-sidebar {
            background: white;
            border-radius: 16px;
            padding: 1.5rem;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            overflow-y: auto;
            height: 100%;
        }
        
        .price-section {
            text-align: center;
            margin-bottom: 2rem;
        }
        
        .original-price {
            font-size: 1.1rem;
            color: #94a3b8;
            text-decoration: line-through;
            margin-bottom: 0.25rem;
        }
        
        .current-price {
            font-size: 2.5rem;
            font-weight: 700;
            color: #1e293b;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }
        
        .current-price .dt-currency-icon-large {
            width: 30px;
            height: 30px;
            object-fit: contain;
            filter: brightness(0) saturate(100%) invert(11%) sepia(15%) saturate(1291%) hue-rotate(178deg) brightness(95%) contrast(95%);
        }
        
        .original-price .dt-currency-icon-small {
            width: 14px;
            height: 14px;
            object-fit: contain;
            filter: brightness(0) saturate(100%) invert(65%) sepia(6%) saturate(839%) hue-rotate(178deg) brightness(92%) contrast(87%);
        }
        
        .course-stats {
            margin-bottom: 2rem;
        }
        
        .stat-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.75rem 0;
            border-bottom: 1px solid #f1f5f9;
        }
        
        .stat-item:last-child {
            border-bottom: none;
        }
        
        .stat-label {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            color: #64748b;
            font-size: 0.95rem;
        }
        
        .stat-value {
            color: #1e293b;
            font-weight: 600;
        }
        
        .buy-button {
            width: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 12px;
            padding: 1rem 2rem;
            font-family: 'Inter', sans-serif;
            font-weight: 700;
            font-size: 1.1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.3);
            margin-bottom: 0.75rem;
        }
        
        .buy-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(102, 126, 234, 0.4);
        }
        
        .lifetime-access {
            text-align: center;
            color: #64748b;
            font-size: 0.9rem;
        }
        
        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
            margin-bottom: 1rem;
            transition: gap 0.3s;
            flex-shrink: 0;
        }
        
        .back-link:hover {
            gap: 0.75rem;
        }
        
        @media (max-width: 1024px) {
            body {
                overflow-y: auto;
                height: auto;
            }
            
            .course-details-container {
                height: auto;
                overflow-y: auto;
                padding: 1rem;
            }
            
            .course-layout {
                grid-template-columns: 1fr;
                height: auto;
                overflow-y: visible;
            }
            
            .course-sidebar {
                height: auto;
                overflow-y: visible;
            }
            
            .course-main {
                height: auto;
                overflow-y: visible;
            }
        }
        
        @media (max-width: 768px) {
            .course-details-container {
                padding: 0.5rem;
            }
            
            .course-main {
                padding: 1rem;
            }
            
            .course-title-section h1 {
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body>
    <div class="course-details-container">
        <a href="courses.html" class="back-link">← Retour aux cours</a>
        
        <div class="course-layout">
            <!-- Main Content -->
            <div class="course-main">
                <div class="course-thumbnail-header" id="course-thumbnail">
                    <!-- Thumbnail will be loaded here -->
                </div>
                
                <div class="course-title-section">
                    <h1 id="course-title">Chargement...</h1>
                </div>
                
                <div class="course-description-section">
                    <h2>Course Description</h2>
                    <p id="course-description">Chargement de la description...</p>
                </div>
                
                <div class="modules-section" id="modules-container">
                    <!-- Modules and lessons will be loaded here -->
                </div>
            </div>
            
            <!-- Sidebar -->
            <div class="course-sidebar">
                <div class="price-section">
                    <div class="original-price" id="original-price" style="display: none;"></div>
                    <div class="current-price" id="current-price">Chargement...</div>
                </div>
                
                <div class="course-stats">
                    <div class="stat-item">
                        <span class="stat-label">📚 Lessons</span>
                        <span class="stat-value" id="lessons-count">0</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label">🌐 Language</span>
                        <span class="stat-value" id="course-language">Français</span>
                    </div>
                </div>
                
                <button class="buy-button" id="buy-button">Acheter maintenant</button>
                <div class="lifetime-access">Accès à vie</div>
            </div>
        </div>
    </div>
    
    <!-- Include API client -->
    <script src="../../js/api-client.js"></script>
    <script src="../../js/course-details.js"></script>
</body>
</html>
