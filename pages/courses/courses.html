<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cours - Synta Academy</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../css/courses.css">
    
    <!-- Supabase Client Library -->
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
</head>
<body>
    <div class="courses-container">
        <div class="courses-header">
            <h1>📚 Tous les Cours</h1>
            <p>Explorez tous les cours disponibles à l'académie</p>
            
            <!-- Filters -->
            <div class="filters-section">
                <select id="category-filter">
                    <option value="">Toutes les catégories</option>
                    <option value="bac-info">Bac Informatique</option>
                    <option value="bac-math">Bac Mathématiques</option>
                    <option value="web-dev">Développement Web</option>
                    <option value="general">Général</option>
                </select>
                
                <select id="level-filter">
                    <option value="">Tous les niveaux</option>
                    <option value="beginner">Débutant</option>
                    <option value="intermediate">Intermédiaire</option>
                    <option value="advanced">Avancé</option>
                </select>
                
                <input type="text" id="search-courses" placeholder="Rechercher un cours...">
            </div>
        </div>
        <div class="courses-list" id="courses-list">
            <!-- Courses will be loaded here -->
        </div>
    </div>
    
    <!-- Include API client first -->
    <script src="../../js/api-client.js"></script>
    <script src="../../js/courses.js"></script>
</body>
</html>
