<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الدورات - أكاديمية سينتا</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../css/courses.css">
    
    <!-- Supabase Client Library -->
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
</head>
<body>
    <div class="courses-container">
        <div class="courses-header">
            <h1>📚 جميع الدورات</h1>
            <p>استكشف جميع الدورات المتاحة في الأكاديمية</p>
            
            <!-- Filters -->
            <div class="filters-section">
                <select id="category-filter">
                    <option value="">جميع الفئات</option>
                    <option value="bac-info">باك معلوماتية</option>
                    <option value="bac-math">باك رياضيات</option>
                    <option value="web-dev">تطوير الويب</option>
                    <option value="general">عام</option>
                </select>
                
                <select id="level-filter">
                    <option value="">جميع المستويات</option>
                    <option value="beginner">مبتدئ</option>
                    <option value="intermediate">متوسط</option>
                    <option value="advanced">متقدم</option>
                </select>
                
                <input type="text" id="search-courses" placeholder="بحث في الدورات...">
            </div>
        </div>
        <div class="courses-list" id="courses-list">
            <!-- Courses will be loaded here -->
        </div>
    </div>
    
    <!-- Include API client first -->
    <script src="../../js/api-client.js"></script>
    <script src="../../js/courses.js"></script>
</body>
</html>
