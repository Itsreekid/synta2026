<!DOCTYPE html>
<html lang="fr" dir="ltr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Classes en Direct - Synta Academy</title>
    <!-- Supabase Client Library -->
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <!-- CSS -->
    <link rel="stylesheet" href="../../css/dashboard.css">
    <style>
        .live-container {
            padding: 20px;
        }

        .live-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .live-card {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
            border-left: 4px solid #ff7b1a;
        }

        .live-status {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.8rem;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .status-scheduled {
            background: #e0f2fe;
            color: #0369a1;
        }

        .status-live {
            background: #fee2e2;
            color: #b91c1c;
            animation: pulse 1.5s infinite;
        }

        .join-btn {
            display: inline-block;
            background: #ff7b1a;
            color: white;
            padding: 10px 20px;
            border-radius: 8px;
            text-decoration: none;
            margin-top: 15px;
            font-weight: bold;
            width: 100%;
            text-align: center;
        }

        .join-btn.disabled {
            background: #e2e8f0;
            color: #94a3b8;
            cursor: not-allowed;
        }

        @keyframes pulse {
            0% {
                opacity: 1;
            }

            50% {
                opacity: 0.5;
            }

            100% {
                opacity: 1;
            }
        }
    </style>
</head>

<body>
    <div class="live-container">
        <h2 class="section-title">🎥 Classes en Direct</h2>
        <p>Rejoignez vos sessions en direct programmées pour vos cours.</p>

        <div id="live-list" class="live-grid">
            <div class="loading">Chargement des sessions...</div>
        </div>

        <h3 class="section-title" style="margin-top: 40px;">🎬 Replays récents</h3>
        <div id="replays-list" class="live-grid">
            <div class="loading">Chargement des replays...</div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="../../authentication.js"></script>
    <script src="../../js/api-client.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async function () {
            // Check auth
            const auth = window.auth;
            if (!auth) return;

            const isAuth = await auth.isAuthenticated();
            if (!isAuth) {
                window.location.href = '../../index.html';
                return;
            }

            loadLiveSessions();
            loadReplays();
        });

        async function loadLiveSessions() {
            const list = document.getElementById('live-list');
            try {
                const response = await fetch(`${window.SyntaAPI.BACKEND_URL}/api/live/upcoming`, {
                    headers: { 'Authorization': `Bearer ${await getToken()}` }
                });
                const sessions = await response.json();

                if (sessions.length === 0) {
                    list.innerHTML = '<div class="no-content">Aucune session programmée pour le moment.</div>';
                    return;
                }

                list.innerHTML = sessions.map(session => {
                    const date = new Date(session.scheduled_at);
                    const isLive = session.status === 'live';
                    return `
                        <div class="live-card">
                            <span class="live-status ${isLive ? 'status-live' : 'status-scheduled'}">
                                ${isLive ? '🔴 EN DIRECT' : '📅 PROGRAMMÉ'}
                            </span>
                            <h4>${session.title}</h4>
                            <p style="font-size: 0.9rem; color: #64748b;">Course: ${session.course.title}</p>
                            <div style="margin-top: 10px;">
                                <i class="far fa-calendar"></i> ${date.toLocaleDateString()} <br>
                                <i class="far fa-clock"></i> ${date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}
                            </div>
                            <a href="${session.join_url}" target="_blank" class="join-btn ${!session.join_url ? 'disabled' : ''}">
                                ${isLive ? 'Rejoindre maintenant' : 'S\'inscrire / Attendre'}
                            </a>
                        </div>
                    `;
                }).join('');
            } catch (error) {
                list.innerHTML = '<div class="error">Erreur de chargement.</div>';
            }
        }

        async function loadReplays() {
            const list = document.getElementById('replays-list');
            try {
                const response = await fetch(`${window.SyntaAPI.BACKEND_URL}/api/live/replays`, {
                    headers: { 'Authorization': `Bearer ${await getToken()}` }
                });
                const replays = await response.json();

                if (replays.length === 0) {
                    list.innerHTML = '<div class="no-content">Aucun replay disponible.</div>';
                    return;
                }

                list.innerHTML = replays.map(replay => `
                    <div class="live-card" style="border-left-color: #64748b;">
                        <h4>${replay.title}</h4>
                        <p style="font-size: 0.9rem; color: #64748b;">Course: ${replay.course.title}</p>
                        <a href="${replay.replay_url}" target="_blank" class="join-btn" style="background: #64748b;">
                            Voir l'enregistrement
                        </a>
                    </div>
                `).join('');
            } catch (error) {
                list.innerHTML = '<div class="error">Erreur de chargement.</div>';
            }
        }

        async function getToken() {
            const { data } = await window.supabaseClient.auth.getSession();
            return data.session?.access_token;
        }
    </script>
</body>

</html>
