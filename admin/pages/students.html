<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Liste des Étudiants - Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --primary: #ff7b1a;
            --secondary: #1E3448;
            --bg: #f8fafc;
        }

        body {
            font-family: 'Tajawal', sans-serif;
            background: var(--bg);
            padding: 2rem;
            color: var(--secondary);
        }

        .header {
            margin-bottom: 2rem;
        }

        .search-bar {
            margin-bottom: 2rem;
            position: relative;
            max-width: 400px;
        }

        .search-bar i {
            position: absolute;
            left: 1rem;
            top: 50%;
            transform: translateY(-50%);
            color: #64748b;
        }

        .search-bar input {
            width: 100%;
            padding: 0.75rem 1rem 0.75rem 2.8rem;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            font-family: inherit;
        }

        .students-table-container {
            background: white;
            border-radius: 16px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            overflow: hidden;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th {
            background: #f1f5f9;
            padding: 1rem 1.5rem;
            font-weight: 600;
            font-size: 0.9rem;
            color: #475569;
        }

        td {
            padding: 1rem 1.5rem;
            border-bottom: 1px solid #f1f5f9;
            font-size: 0.95rem;
        }

        .student-name {
            display: flex;
            align-items: center;
            gap: 1rem;
            font-weight: 600;
        }

        .avatar {
            width: 32px;
            height: 32px;
            background: #e2e8f0;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #64748b;
            font-size: 0.8rem;
        }

        .badge {
            font-size: 0.75rem;
            padding: 0.2rem 0.6rem;
            border-radius: 6px;
            font-weight: 500;
        }

        .badge-class {
            background: #dbeafe;
            color: #1e40af;
        }

        .badge-branch {
            background: #fef9c3;
            color: #854d0e;
        }

        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(255, 255, 255, 0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid var(--primary);
            border-bottom-color: transparent;
            border-radius: 50%;
            animation: rotation 1s linear infinite;
        }

        @keyframes rotation {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>
    <div id="loading" class="loading-overlay">
        <div class="spinner"></div>
    </div>

    <div class="header">
        <h1>Liste des Étudiants</h1>
        <p>Gérez les comptes et les accès des étudiants</p>
    </div>

    <div class="search-bar">
        <i class="fas fa-search"></i>
        <input type="text" id="searchInput" placeholder="Rechercher un étudiant..." oninput="filterStudents()">
    </div>

    <div class="students-table-container">
        <table>
            <thead>
                <tr>
                    <th>Étudiant</th>
                    <th>Email</th>
                    <th>Classe</th>
                    <th>Branche</th>
                    <th>Date d'inscription</th>
                    <th>Solde</th>
                </tr>
            </thead>
            <tbody id="studentsBody">
                <!-- Students will be loaded here -->
            </tbody>
        </table>
    </div>

    <!-- Supabase Client Library -->
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script src="../../authentication.js"></script>
    <script src="../js/admin-dashboard.js"></script>
    <script>
        let allStudents = [];

        document.addEventListener('DOMContentLoaded', initStudents);

        async function initStudents() {
            // Wait for auth
            let attempts = 0;
            while (!window.auth && attempts < 20) {
                await new Promise(resolve => setTimeout(resolve, 100));
                attempts++;
            }

            if (window.AdminDashboard) {
                allStudents = await window.AdminDashboard.loadStudents();
                renderStudents(allStudents);
            }
            document.getElementById('loading').style.display = 'none';
        }

        function renderStudents(students) {
            const body = document.getElementById('studentsBody');
            if (students.length === 0) {
                body.innerHTML = '<tr><td colspan="6" style="text-align: center; padding: 3rem; color: #64748b;">Aucun étudiant trouvé.</td></tr>';
                return;
            }

            body.innerHTML = students.map(student => `
                <tr>
                    <td>
                        <div class="student-name">
                            <div class="avatar">${student.fullname?.charAt(0) || 'S'}</div>
                            ${student.fullname || 'Étudiant'}
                        </div>
                    </td>
                    <td>${student.email}</td>
                    <td><span class="badge badge-class">${student.class || '-'}</span></td>
                    <td><span class="badge badge-branch">${student.branch || '-'}</span></td>
                    <td>${new Date(student.created_at).toLocaleDateString('fr-FR')}</td>
                    <td><strong>${student.balance || '0.00'} DT</strong></td>
                </tr>
            `).join('');
        }

        function filterStudents() {
            const q = document.getElementById('searchInput').value.toLowerCase();
            const filtered = allStudents.filter(s =>
                s.full_name?.toLowerCase().includes(q) ||
                s.email.toLowerCase().includes(q)
            );
            renderStudents(filtered);
        }
    </script>
</body>

</html>
