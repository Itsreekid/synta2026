<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Overview - Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --primary: #ff7b1a;
            --secondary: #1E3448;
            --success: #10b981;
            --bg: #f8fafc;
        }

        body {
            font-family: 'Tajawal', sans-serif;
            background: var(--bg);
            padding: 2rem;
            color: var(--secondary);
        }

        .header {
            margin-bottom: 2rem;
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 700;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 1.5rem;
            margin-bottom: 3rem;
        }

        .stat-card {
            background: white;
            padding: 1.5rem;
            border-radius: 16px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            display: flex;
            align-items: center;
            gap: 1.5rem;
        }

        .stat-icon {
            width: 50px;
            height: 50px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
        }

        .stat-icon.students {
            background: rgba(59, 130, 246, 0.1);
            color: #3b82f6;
        }

        .stat-icon.offers {
            background: rgba(168, 85, 247, 0.1);
            color: #a855f7;
        }

        .stat-icon.revenue {
            background: rgba(16, 185, 129, 0.1);
            color: #10b981;
        }

        .stat-info h3 {
            font-size: 0.9rem;
            color: #64748b;
            margin-bottom: 0.25rem;
        }

        .stat-info .value {
            font-size: 1.5rem;
            font-weight: 700;
        }

        .chart-placeholder {
            background: white;
            padding: 2rem;
            border-radius: 16px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            height: 300px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #64748b;
            border: 2px dashed #e2e8f0;
        }

        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(255, 255, 255, 0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid var(--primary);
            border-bottom-color: transparent;
            border-radius: 50%;
            animation: rotation 1s linear infinite;
        }

        @keyframes rotation {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>
    <div id="loading" class="loading-overlay">
        <div class="spinner"></div>
    </div>

    <div class="header">
        <h1>Tableau de bord administrateur</h1>
        <p>Aperçu de l'activité de Synta Academy</p>
    </div>

    <div class="stats-grid">
        <div class="stat-card">
            <div class="stat-icon students"><i class="fas fa-user-graduate"></i></div>
            <div class="stat-info">
                <h3>Étudiants inscrits</h3>
                <div class="value" id="count-students">0</div>
            </div>
        </div>
        <div class="stat-card">
            <div class="stat-icon offers"><i class="fas fa-tags"></i></div>
            <div class="stat-info">
                <h3>Offres actives</h3>
                <div class="value" id="count-offers">0</div>
            </div>
        </div>
        <div class="stat-card">
            <div class="stat-icon revenue"><i class="fas fa-money-bill-wave"></i></div>
            <div class="stat-info">
                <h3>Revenus totaux</h3>
                <div class="value" id="count-revenue">0.00 DT</div>
            </div>
        </div>
    </div>

    <div class="header">
        <h2>Activité récente</h2>
    </div>
    <div class="chart-placeholder">
        <div class="text-center">
            <i class="fas fa-chart-area fa-3x mb-3" style="opacity: 0.2;"></i>
            <p>Le graphique d'activité sera disponible bientôt</p>
        </div>
    </div>

    <script src="../../authentication.js"></script>
    <script src="../js/admin-dashboard.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            await initOverview();
        });

        async function initOverview() {
            // Wait for auth
            let attempts = 0;
            while (!window.auth && attempts < 20) {
                await new Promise(resolve => setTimeout(resolve, 100));
                attempts++;
            }

            if (window.AdminDashboard) {
                const stats = await window.AdminDashboard.loadOverview();
                if (stats.success) {
                    document.getElementById('count-students').textContent = stats.students;
                    document.getElementById('count-offers').textContent = stats.offers;
                    document.getElementById('count-revenue').textContent = stats.revenue + ' DT';
                }
            }
            document.getElementById('loading').style.display = 'none';
        }
    </script>
</body>

</html>
